<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXO Saúde - Pacientes</title>

    <link rel="stylesheet" href="/css/pacientes.css">
</head>

<body>

    <aside class="sidebar">

        <h2>NEXO Saúde</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="ativo" href="pacientes.html">Pacientes</a>
            <a href="./consultas.html">Consultas</a>
            <a href="anamnese.html">Atendimentos</a>
            <a href="./usuarios.html">Usuários</a>
            <a href="./configuracoes.html">Configurações</a>

        </nav>

    </aside>

    <main class="conteudo">

        <header>
            <h1>Gestão de Pacientes</h1>
            <p>Gerencie os pacientes cadastrados na clínica.</p>

            <a class="novo-paciente" href="cadastro-paciente.html" id="novo-paciente">
                 + Novo Paciente
            </a>
        </header>

        <!-- Filtros de pacientes -->
        <section class="filtros">

            <input type="text" id="busca"
                placeholder="Buscar por nome, CPF ou prontuário...">

            <select id="filtro-status">
                <option value="">Todos os status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>

            <select id="filtro-convenio">
                <option value="">Todos os convênios</option>
                <option value="Particular">Particular</option>
                <option value="Unimed">Unimed</option>
            </select>

        </section>

        <!-- Tabela de pacientes -->
        <section class="lista-pacientes">

            <table>

                <thead>
                    <tr>
                        <th>Prontuário</th>
                        <th>Paciente</th>
                        <th>CPF</th>
                        <th>Contato</th>
                        <th>Convênio</th>
                        <th>Cadastro</th>
                        <th>Última Consulta</th>
                    </tr>
                </thead>

                <!-- Pacientes carregados pelo JavaScript -->
                <tbody id="tabela-pacientes">

                </tbody>

            </table>

            <div class="paginacao">

                <p id="total-pacientes">Carregando pacientes...</p>

                <div class="paginas">
                    <a href="#" id="anterior">Anterior</a>
                    <a class="pagina-atual" href="#" id="pagina-atual">1</a>
                    <a href="#" id="proximo">Próximo</a>
                </div>

            </div>

        </section>

    </main>

    <!-- JavaScript da página -->
    <script src="/js/pacientes.js"></script>

</body>
</html>
