<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO Saúde - Cadastrar Paciente</title>

    <link rel="stylesheet" href="/css/cadastro-paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <aside class="sidebar">
        <h2>NEXO Saúde</h2>

        <nav>
            <a href="dashboard.html">
                <i class="bi bi-grid"></i> Dashboard
            </a>

            <a href="pacientes.html" class="ativo">
                <i class="bi bi-people"></i> Pacientes
            </a>

            <a href="consultas.html">
                <i class="bi bi-calendar-check"></i> Consultas
            </a>

            <a href="anamnese.html">
                <i class="bi bi-clipboard2-pulse"></i> Atendimentos
            </a>

            <a href="usuarios.html">
                <i class="bi bi-person"></i> Usuários
            </a>

            <a href="configuracoes.html">
                <i class="bi bi-gear"></i> Configurações
            </a>
        </nav>
    </aside>

    <main class="conteudo">

        <header class="cabecalho">
            <h1>Cadastrar Paciente</h1>
            <p>Preencha os dados abaixo para incluir um novo paciente no sistema.</p>
        </header>

        <form id="form-paciente">


            <section class="card">

                <h2>
                    <i class="bi bi-person"></i>
                    Dados Pessoais
                </h2>

                <div class="campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="campo">
                        <label for="data_nascimento">Data de nascimento</label>
                        <input type="date" id="data_nascimento" name="data_nascimento">
                    </div>

                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" name="sexo">
                            <option value="">Selecione</option>
                            <option>Feminino</option>
                            <option>Masculino</option>
                            <option>Outro</option>
                            <option>Não informado</option>
                        </select>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="campo campo-duplo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                    </div>

                </div>

            </section>

            <div class="cards-centrais">

              

                <section class="card">

                    <h2>
                        <i class="bi bi-clipboard2-check"></i>
                        Convênio e Atendimento
                    </h2>

                    <div class="campo">
                        <label for="convenio">Convênio</label>
                        <select id="convenio" name="convenio">
                            <option value="">Selecione o convênio</option>
                            <option>Particular</option>
                            <option>Unimed</option>
                            <option>Amil</option>
                            <option>Bradesco Saúde</option>
                            <option>SulAmérica</option>
                            <option>Outro</option>
                        </select>
                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="servico">Serviço</label>
                            <select id="servico" name="servico">
                                <option value="">Selecione</option>
                                <option>Consulta</option>
                                <option>Retorno</option>
                                <option>Exame</option>
                                <option>Procedimento</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option>Ativo</option>
                                <option>Inativo</option>
                            </select>
                        </div>

                    </div>

                </section>


                <section class="card">

                    <h2>
                        <i class="bi bi-geo-alt"></i>
                        Endereço
                    </h2>

                    <div class="linha">

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000">
                        </div>

                        <div class="campo campo-duplo">
                            <label for="rua">Rua</label>
                            <input type="text" id="rua" name="rua" placeholder="Nome da rua">
                        </div>

                        <div class="campo">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" placeholder="Nº">
                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco...">
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro">
                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo campo-duplo">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2">
                        </div>

                    </div>

                </section>

            </div>

         

            <section class="card">

                <h2>
                    <i class="bi bi-person-lines-fill"></i>
                    Contato de Emergência
                </h2>

                <div class="linha">

                    <div class="campo campo-duplo">
                        <label for="nome_emergencia">Nome do contato</label>
                        <input type="text" id="nome_emergencia" name="nome_emergencia" placeholder="Nome completo">
                    </div>

                    <div class="campo">
                        <label for="parentesco">Parentesco</label>
                        <select id="parentesco" name="parentesco">
                            <option value="">Selecione</option>
                            <option>Pai</option>
                            <option>Mãe</option>
                            <option>Cônjuge</option>
                            <option>Filho(a)</option>
                            <option>Irmão(ã)</option>
                            <option>Outro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="telefone_emergencia">Telefone</label>
                        <input type="tel" id="telefone_emergencia" name="telefone_emergencia" placeholder="(00) 00000-0000">
                    </div>

                </div>

            </section>

            <div class="botoes">

                <a href="pacientes.html" class="cancelar">
                    Cancelar
                </a>

                <button type="submit" class="cadastrar">
                    Cadastrar Paciente
                </button>

            </div>

        </form>

    </main>

<script src="/js/cadastro-paciente.js"></script></body>
</html>
